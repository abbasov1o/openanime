# Builds an unsigned IPA for every push to main.
workflows:
  shirox-ios-ipa:
    name: Shirox iOS (unsigned IPA)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: false
        - pattern: deploy
          include: true
          source: false
    scripts:
      - name: Build unsigned IPA
        script: bash buildipa.sh
    artifacts:
      - build/Shirox.ipa
