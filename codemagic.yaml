workflows:
  shirox-ios-ipa:
    name: Shirox iOS (unsigned IPA)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    cache:
      cache_key_prefix: shirox-spm
      cache_paths:
        - ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: false
    scripts:
      - name: Build unsigned IPA
        script: bash buildipa.sh
    artifacts:
      - build/Shirox.ipa
